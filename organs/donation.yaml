# Карт нет — донорства нет (G1 fail-closed, SPEC-0009): орган без карты не готов к донорству.
# Без карт остались reference/substrate/education-органы реестра (антропics/skills, f/prompts.chat,
# langflow, hermes-agent, Awesome-Hacking, субстрат linux/kubernetes/node/go/rust, образование):
# тело их не патчит по определению режима — G1 защищает и их.
# Типирование живым чтением upstream с датой — обязательный шаг перед первым патчем.
