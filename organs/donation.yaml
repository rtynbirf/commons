  # --- МЕТАБОЛИЗМ: инференс C/C++. Типирован: ошейников нет, AI-код — с пониманием. ---
  - repo: ggml-org/llama.cpp
    protocol: none-observed
    decision: donate
    evidence:
      - date: 2026-11-02
