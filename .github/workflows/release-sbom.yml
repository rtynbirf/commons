name: sbom

# ПРЕДЛОЖЕНИЕ-38 (issue #12): CycloneDX SBOM на каждый релиз.
# Генератор — scripts/sbom_cyclonedx.py (stdlib-only, детерминированный:
# без часов, uuid5 от коммита, сортировка путей). Приёмка машинная:
# последний релиз commons содержит sbom.json, валидный схемой CycloneDX.
# На каждый пуш — живое доказательство генерации (артефактом прогона);
# на release published — sbom.json прикладывается к релизу автоматически.

# hardening 2026-11-10 (immutable-safe): триггер [created] ловит и черновики,
# и сразу опубликованные релизы. Джоба attach прикладывает sbom.json ТОЛЬКО
# к черновику (паттерн draft -> assets -> publish); если релиз уже опубликован,
# джоба честно пропускает (зелёный прогон) — править опубликованный релиз
# запрещено immutable releases. Порядок работы: создать черновик релиза →
# sbom приложится автоматически → опубликовать черновик вручную.
on:
  push:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Генерация sbom.json (stdlib, детерминированная)
        run: python3 scripts/sbom_cyclonedx.py --output sbom.json

      - name: Selftest — двойная сборка = байт-идентично, структура/полнота/хеши
        run: python3 scripts/sbom_selftest.py .
      # Память прогона артефактом снята волной ×4: квота Artifact storage аккаунта
      # исчерпана (Failed to CreateArtifact, 2026-11-08) — красила зелёные гейты.
      # Свидетельство = сам прогон (selftest в логе); на релизах sbom.json
      # прикладывается job-ом attach.

  attach:
    # Прикладываем sbom.json к черновику релиза через REST API
    # (immutable releases запрещают менять опубликованный релиз;
    # существующий ассет не перезаписывается, конфликт = красный прогон).
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sbom
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Генерация sbom.json на дереве релиза
        run: python3 scripts/sbom_cyclonedx.py --output sbom.json

      - name: Прикладывание к черновику релиза (gh api, immutable-safe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ "${{ github.event.release.draft }}" != "true" ]; then
            echo "Релиз $TAG не черновик — под immutable releases sbom прикладывается только к черновикам; пропускаю (зелёный прогон)."
            exit 0
          fi
          RID=$(gh api "/repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n1)
          if [ -z "$RID" ]; then
            echo "::error::Черновик релиза $TAG не найден."; exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=sbom.json" --input sbom.json -H "Content-Type: application/octet-stream" > /dev/null
          echo "sbom.json приложен к черновику релиза $TAG (после публикации релиз неизменяем)"
