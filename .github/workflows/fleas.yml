# Свип по расписанию (0.18.0): блохи ловятся не только на push/PR —
# ссылки умирают сами, без пушей. Недельный свип — синтез мировой практики
# scheduled sweeps (lychee, docs nightlies). Красный свип = блоха,
# выметается немедленно; «на автомате пахать» приговорено приёмкой
# (tests/test_hygiene.py::test_weekly_sweep_is_scheduled).
# Пины по SHA зафиксированы живым GitHub API 2026-11-02 (PROVENANCE.md §2).
# Волна-9 (0.23.0): память воротов — каждый свип оставляет json-отчёт
# артефактом и таблицу в summary (W-0017); ворота не висят (timeout).
name: fleas

on:
  schedule:
    - cron: "43 2 * * 1" # еженедельно, понедельник 02:43 UTC — вне общего часа
  workflow_dispatch:

# Минимальные полномочия воркфлоу (Scorecard Token-Permissions)
permissions:
  contents: read

jobs:
  doctor:
    # Офлайн-гейты дома — тот же доктор, что и в ci.yml, но по расписанию
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # волна №26: гейт spec-first судит HEAD-коммит по родителю — shallow-клон (depth: 1) оставлял гейт fail-closed красным
          persist-credentials: false

      - name: Доктор дома (машиночитаемый отчёт)
        run: python3 scripts/doctor.py --json > doctor-report.json

      - name: Память воротов — таблица в summary
        if: always()
        run: python3 scripts/doctor_report.py doctor-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Память воротов — артефакт прогона
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (верифицировано живым API 2026-11-02)
        with:
          name: doctor-report-${{ github.run_id }}
          path: doctor-report.json
          if-no-files-found: error

      - name: Автопортреты свежи (гейт --check + регенерация)
        run: |
          python3 scripts/organ_map.py --check
          python3 scripts/selfmap.py
          git diff --exit-code -- docs/selfmap.md

  links:
    # Внешние ссылки: доктор по догме офлайн (детерминизм, SPEC-0006),
    # поэтому сеть вынесена в плановый свип. lychee: ретраи, токен для
    # GitHub-лимитов, красный = мёртвая ссылка.
    # medium.com — стена ботов (403 всем не-браузерам датацентровых IP,
    # живой прогон 41471082096; часом ранее тот же свип был зелёным) —
    # свип краснеет от мёртвых ссылок, а не от чужих ошейников.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Внешние ссылки живы (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0 (2026-11-02)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress --max-retries 3 --max-concurrency 4 --timeout 20
            --exclude "github\.com/<owner"
            --exclude "medium\.com"
            --exclude "localhost|127\.0\.0\.1"
            README.md README.en.md ROADMAP.md CHANGELOG.md llms.txt docs specs
          fail: true
