        fact: "«AI-generated code is allowed. What is not allowed is submitting code you do not understand» — автор отвечает за каждую строку; фичи — issue-first"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/ggml-org/llama.cpp/master/LICENSE"
        fact: "лицензия MIT"

  # --- МЕТАБОЛИЗМ: доступ к моделям. Ошейника нет, но агентов-доноров орган не пускает. ---
  - repo: huggingface/transformers
    protocol: none-observed
    decision: patch-inside
    evidence:
