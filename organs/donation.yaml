#
# Донорские карты органов COMMONS (SPEC-0009, ADR-0011) — данные, не код.
# Правила меняются правкой этого файла; immune/donation.py — только механизм применения.
# Факты типирования — живое чтение upstream на дату (PROVENANCE.md §2): факты не выдумываются,
# каждая запись evidence несёт дату, https-URL и что именно проверено.
# 0.2.0 (2026-11-02): реестр типирован до конца по патч-целям — dependency/adapter/external
# имеют карты; reference/substrate/education карт не имеют: тело их не патчит (референс,
# субстрат, образование) — «нет карты — донорства нет» (G1) защищает и их.
version: 0.2.0
updated: 2026-11-02
spec: SPEC-0009

# Протоколы upstream (как орган принимает кровь) и решения тела.
protocols: [dco, none-observed, cla, unverified]
decisions: [donate, patch-inside, consume-only]

cards:
  # --- ГЕНОМ: spec-driven ядро. Ошейников нет; AI-вклад раскрывается трейлером. ---
  - repo: github/spec-kit
    protocol: none-observed
    decision: donate
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/github/spec-kit/main/CONTRIBUTING.md"
        fact: "502 строки; CLA и DCO не упоминаются; AI-вклад раскрывается в PR (агент, модель, режим) и Assisted-by трейлером в коммитах"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/github/spec-kit/main/.github/PULL_REQUEST_TEMPLATE.md"
        fact: "секция AI Disclosure в шаблоне PR; ошейников и передачи прав нет"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/github/spec-kit/main/LICENSE"
        fact: "лицензия MIT"

  # --- СЕНСОРИКА: документы в Markdown. Ошейников не обнаружено. ---
  - repo: microsoft/markitdown
    protocol: none-observed
    decision: donate
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/microsoft/markitdown/main/CONTRIBUTING.md"
        fact: "CONTRIBUTING.md отсутствует (404) в корне и в .github/ — требований к вкладу нет"
      - date: 2026-11-02
        url: "https://github.com/microsoft/markitdown/pull/2807"
        fact: "на живом PR нет CLA-бота и CLA-проверок"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/microsoft/markitdown/main/LICENSE"
        fact: "лицензия MIT"
    note: "перепроверить при открытии первого PR: CLA-бот может появиться в момент открытия"

  # --- СЕНСОРИКА: извлечение из веба. Лицензия закрыта для донорства. ---
  - repo: firecrawl/firecrawl
    protocol: none-observed
    decision: consume-only
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/firecrawl/firecrawl/main/CONTRIBUTING.md"
        fact: "71 строка; CLA и DCO не упоминаются; fork → branch → PR без передачи прав"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/firecrawl/firecrawl/main/LICENSE"
        fact: "AGPL-3.0 — лицензия вне allowed матрицы SPEC-0006: дарить некому, тело потребляет орган как внешний узел"

  # --- ЭФФЕКТОРЫ: браузер. Ошейников не обнаружено; копирайт — частное лицо. ---
  - repo: browser-use/browser-use
    protocol: none-observed
    decision: donate
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/browser-use/browser-use/main/.github/CONTRIBUTING.md"
        fact: "CONTRIBUTING не упоминает CLA и DCO; ведёт на contribution-guide"
      - date: 2026-11-02
        url: "https://docs.browser-use.com/development/contribution-guide"
        fact: "fork → branch → PR; ни слова о CLA/DCO"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/browser-use/browser-use/main/LICENSE"
        fact: "лицензия MIT, копирайт частного лица (Gregor Zunic), не корпорации"
      - date: 2026-11-02
        url: "https://github.com/browser-use/browser-use/tree/main/.github"
        fact: "PR-шаблона нет: ни .github/PULL_REQUEST_TEMPLATE.md, ни директории PULL_REQUEST_TEMPLATE/"

  # --- ЭФФЕКТОРЫ: автономное действие. Ошейников нет; вход — по правилам органа. ---
  - repo: openclaw/openclaw
    protocol: none-observed
    decision: donate
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/openclaw/openclaw/main/CONTRIBUTING.md"
        fact: "284 строки; CLA и DCO не упоминаются; лимит 20 открытых PR на автора, refactor-only PR отклоняются, фичи — через issue"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/openclaw/openclaw/main/.github/pull_request_template.md"
        fact: "шаблон требует проблему, user impact и evidence; передачи прав нет"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/openclaw/openclaw/main/LICENSE"
        fact: "лицензия MIT"

  # --- ЭФФЕКТОРЫ: реверс-инжиниринг. Декларации PR — только человеческие. ---
  - repo: morluto/rea
    protocol: none-observed
    decision: patch-inside
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/morluto/rea/main/CONTRIBUTING.md"
        fact: "451 строка; CLA и DCO не упоминаются"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/morluto/rea/main/.github/pull_request_template.md"
        fact: "«AI agents must leave these declarations to a human» — декларации готовности PR оставляет человек; агент не может сам отправить кровь"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/morluto/rea/main/LICENSE"
        fact: "лицензия MIT"
    note: "ошейника нет, но правило органа человеческое: отправляет человек-владелец; улучшения тела живут внутри"

  # --- МЕТАБОЛИЗМ: локальный инференс. Ошейников не обнаружено. ---
  - repo: ollama/ollama
