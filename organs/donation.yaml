    note: "человек-владелец может отправить патч сам; улучшения тела живут внутри (адаптеры, обвязка)"

  # --- НЕРВНЫЕ АЛЬТЕРНАТИВЫ: оркестрация. Ошейников нет; крупные PR — issue-first. ---
