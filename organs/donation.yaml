    decision: patch-inside
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/langgenius/dify/main/LICENSE"
        fact: "«License and Contributor Agreement», п.2: производитель может менять соглашение, вклады идут в коммерческие операции — права на кровь переходят хозяину"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/langgenius/dify/main/CONTRIBUTING.md"
        fact: "96 строк; отсылает к лицензии-договору: «read our short License and Contributor Agreement»; CLA-бота нет — ошейник живёт в LICENSE"
    note: "лицензия вне allowed матрицы SPEC-0006 («Apache-2.0 с условиями») — взаимности нет; обвязка пишется внутри организма"

  # --- НЕРВНЫЕ АЛЬТЕРНАТИВЫ: внешний конвейер. Двойная несовместимость: fair-code + CLA. ---
  - repo: n8n-io/n8n
    protocol: cla
    decision: consume-only
    evidence:
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/n8n-io/n8n/master/CONTRIBUTING.md"
        fact: "CLA обязателен (Indie Open Source); PR не мержится без подписи — бот требует её"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/n8n-io/n8n/master/CONTRIBUTOR_LICENSE_AGREEMENT.md"
        fact: "«I give n8n permission to license my contributions on any terms they like» — права на кровь переходят хозяину"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/n8n-io/n8n/master/LICENSE.md"
        fact: "Sustainable Use License (fair-code); .ee-файлы вообще не лицензированы"
    note: "использование — референс-развёртывание (pipeline/, ROADMAP M3); донорство не имеет смысла"

