name: ci

on:
  push:
    branches: [main]
  pull_request:

# Минимальные полномочия воркфлоу (Scorecard Token-Permissions)
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Пин по SHA (Scorecard Pinned-Dependencies); v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: YAML и JSON валидны
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          import yaml
          ok = True
          for p in sorted(pathlib.Path('.').rglob('*')):
              if p.is_dir() or '.git' in p.parts:
                  continue
              if p.suffix in ('.yaml', '.yml'):
                  try:
                      yaml.safe_load(p.read_text(encoding='utf-8'))
                  except Exception as e:
                      ok = False
                      print(f'YAML FAIL {p}: {e}')
              elif p.suffix == '.json':
                  try:
                      json.loads(p.read_text(encoding='utf-8'))
                  except Exception as e:
                      ok = False
                      print(f'JSON FAIL {p}: {e}')
          sys.exit(0 if ok else 1)
          PY

      - name: Спеки имеют статус
        run: |
          for f in specs/*.md; do
            grep -qi '^[[:space:]]*-*[[:space:]]*Статус:' "$f" || { echo "нет статуса: $f"; exit 1; }
          done
          echo "все спеки снабжены статусом"

      - name: Конверт крови соответствует SPEC-0003
        run: |
          python3 - <<'PY'
          import json, pathlib
          schema = json.loads(pathlib.Path('blood/envelope.schema.json').read_text(encoding='utf-8'))
          required = {'id', 'ts', 'type', 'source', 'organ', 'trace_id', 'payload', 'cost'}
          assert required.issubset(schema['properties']), 'не все обязательные поля в схеме'
          assert set(schema['required']) == required, 'required в схеме не совпадает с контрактом'
          print('схема крови согласована со SPEC-0003')
          PY

  reuse:
    # Иммунитет: пофайловое лицензирование REUSE 3.3 (SPDX) — PROVENANCE.md машинно-проверяем
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: REUSE lint
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5

  immune:
    # Иммунитет: лицензионный барьер тела (SPEC-0006, ADR-0008) —
    # AGPL/fair-code/NOASSERTION не встраиваются; fail-closed на неизвестное
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Лицензионный барьер (манифест + реестр)
        run: python3 -m immune

  pipeline:
    # Конвейер: n8n как внешний узел (SPEC-0007, ADR-0009) — артефакты-данные,
    # белый список команд, fail-closed на произвольный shell
  transplant:
    # Исходящий иммунитет: донорский протокол органов (SPEC-0008, ADR-0010) —
    # кровь уходит в upstream только по рукопожатию (DCO) и тому, кто дарит;
    # CLA-ошейник не подписывается — патч живёт внутри организма
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Валидатор конвейера (воркфлоу + compose)
        run: python3 -m pipeline

      - name: Донорский протокол (карты донорства)
        run: python3 -m immune.donation

  effector:
    # Эффектор: openclaw как внешние руки (SPEC-0008, ADR-0010) — CLI-мост,
    # белый список методов, данные-политика fail-closed (CVE-2026-25253, ClawHub)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Валидатор эффекта (политика + белый список)
        run: python3 -m openclaw check

  core:
    # Исполнимое ядро 0.2: приёмки спек SPEC-0001..0003 как pytest (ADR-0004)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Тесты ядра (приёмки SPEC-0001..0004)
        run: |
          python -m pip install --disable-pip-version-check --quiet '.[dev]'
          python -m pytest -q

  pathogens:
    # Иммунитет против патогенов (0.9.0): известные уязвимости зависимостей
    # по OSV-базе (pip-audit). Барьер лицензий (job immune) — чистая функция
    # без сети (ADR-0008); патогены приходят с пищей (зависимостями), поэтому
    # ищутся там, где тело кормится, — в установленном окружении целиком.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Патогены (pip-audit 2.10.1, OSV)
        run: |
          python -m pip install --disable-pip-version-check --quiet '.[dev]' 'pip-audit==2.10.1'
          python -m pip_audit --skip-editable --progress-spinner off
