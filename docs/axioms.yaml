# Живая матрица аксиом пакета «Human Membrane» A01–A25 против тела дома (W-0034, волна №25).
#
# Источник матрицы: ревизия 2026-11-03 (runs/2026-11-03-revision/REVISION.md, §2.1).
# Здесь — живая версия: вердикт двигается только вместе с доказательством.
# Правила:
#   - verdict: pass | partial | served | adr | open (чужое слово — блоха, гейт доктора `axioms`);
#   - evidence: указатели на доказательства в доме (тесты, спеки, ADR, код) — мёртвый указатель — блоха;
#   - open/partial обязаны называть plan (где закрывается) — открытая аксиома без плана — обман;
#   - порядок законов (laws_priority) — данные для ADR-0016; ADR называет ровно эти законы.
laws_priority:
  - name: честность
    why: кровь не лжёт; честный отказ дороже выдуманного успеха (W-0021, A02 — незаявленное не достраивается)
  - name: безопасность
    why: fail-closed, страж до факта, ключи только у Человека (SPEC-0002 пп.8–11, SPEC-0006)
  - name: кровь
    why: append-only, пролитая кровь валидна навсегда, история не переписывается (SPEC-0003 п.4/п.6)
  - name: тождество
    why: необратимое — только с Человеком; тишина = «нет» (SPEC-0004 пп.7–9, ADR-0015)
  - name: дисциплина
    why: спека раньше кода, красный прогон, DCO (W-0030, REUSE 3.3)
  - name: время
    why: время Человека дороже времени машины (W-0018, дожимы по тишине)
