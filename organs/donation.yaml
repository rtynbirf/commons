        fact: "161 строка; CLA и DCO не упоминаются; AI-авторство раскрывается Co-Authored-By трейлером в коммите"
      - date: 2026-11-02
        url: "https://raw.githubusercontent.com/Graphify-Labs/graphify/v8/LICENSE"
        fact: "лицензия Apache-2.0"

