[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commons-organism"
version = "0.31.0"
description = "COMMONS: исполнимое ядро организма — ствол мозга (SPEC-0001), синапсы MCP (SPEC-0002), кровь (SPEC-0003), живой организм PID 1 (SPEC-0004), память (SPEC-0005), иммунитет (SPEC-0006), конвейер (SPEC-0007), эффектор — openclaw как внешние руки (SPEC-0008), гематология (SPEC-0003 v0.4.0), трансплантология (SPEC-0009), типирование реестра (SPEC-0009 v0.1.1), персона и каналы (SPEC-0010)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rtynbirf" }]
keywords = ["commons", "organism", "mcp", "ai-agents", "spec-driven"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
commons-pid1 = "brainstem.pid1:main"
commons-immune = "immune.barrier:main"
commons-pipeline = "pipeline.check:main"
commons-openclaw = "openclaw.adapter:main"
commons-transplant = "immune.donation:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["brainstem*", "synapse*", "blood*", "memory*", "immune*", "pipeline*", "openclaw*"]
