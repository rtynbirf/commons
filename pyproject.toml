[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commons-organism"
version = "0.3.0"
description = "COMMONS: исполнимое ядро организма — ствол мозга (SPEC-0001), синапсы MCP (SPEC-0002), кровь (SPEC-0003)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rtynbirf" }]
keywords = ["commons", "organism", "mcp", "ai-agents", "spec-driven"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["brainstem*", "synapse*", "blood*"]
