# Манифест синапсов COMMONS: декларация органов как MCP-серверов (SPEC-0002, ADR-0002).
# Источник истины для шлюза: орган без записи здесь для тела не существует (veto).
# Поле `adapter` — класс адаптера, загружаемый шлюзом динамически:
# новый орган подключается правкой манифеста, без правки кода шлюза (приёмка SPEC-0002).
version: 0.2.2
updated: 2026-11-02
transport_default: stdio

organs:
  - name: ollama
    system: metabolism
    mode: dependency
    upstream: https://github.com/ollama/ollama
    license: MIT
    transport: http
    endpoint: ${OLLAMA_HOST}
    healthcheck: GET /api/tags
    tools: [list_models, generate, chat, embeddings]
    authority: {network: localhost-only, fs: none}
    adapter: synapse.adapters.ollama:OllamaAdapter

  - name: llama.cpp
    system: metabolism
    mode: dependency
    upstream: https://github.com/ggml-org/llama.cpp
    license: MIT
    transport: http
    endpoint: ${LLAMA_SERVER_URL}
    healthcheck: GET /health
    tools: [completion, embedding]
    authority: {network: localhost-only, fs: none}
    adapter: synapse.adapters.llamacpp:LlamaCppAdapter
    note: 'запас для ollama (SPEC-0001 G2); подключён 2026-11-01 — метаболизм двуорганного пульса (runs/2026-11-01-organism-pulse); запущен: llama-server -m <gguf> --port 8080'

  - name: markitdown
    system: senses
    mode: dependency
    upstream: https://github.com/microsoft/markitdown
    license: MIT
    transport: stdio
    command: markitdown-mcp
    healthcheck: initialize handshake
    tools: [convert_to_markdown]
    authority: {fs: read-only-input-dir, network: none}
    adapter: synapse.adapters.mcp_stdio:MCPStdioAdapter
    note: 'подключён 2026-11-01 — первый живой пульс организма (runs/2026-11-01-first-pulse); вход — только file-URI'

  - name: browser-use
    system: effectors
    mode: dependency
    upstream: https://github.com/browser-use/browser-use
    license: MIT
    transport: stdio
    command: browser-use-mcp
    healthcheck: initialize handshake
    tools: [navigate, click, extract, screenshot]
    authority: {network: allowlist, fs: downloads-dir}
    adapter: synapse.adapters.mcp_stdio:MCPStdioAdapter

  - name: openclaw
    system: effectors
    mode: dependency
    upstream: https://github.com/openclaw/openclaw
    license: MIT
    transport: http
    endpoint: ${OPENCLAW_GATEWAY_URL}
    healthcheck: GET /healthz
    tools: [health, status, send_message, abort]
    authority: {network: localhost-only, fs: none}
    adapter: openclaw.adapter:OpenClawAdapter
    note: 'эффектор подключён 2026-11-02 (0.11.0, SPEC-0008, ADR-0010): мост CLI `openclaw gateway call` — белый список методов health/status/chat.send/chat.abort, параметры — данные JSON (shell не строится); токен — только env OPENCLAW_GATEWAY_TOKEN; живой gateway — на хосте человека (PID 1); openclaw — руки, не второй ствол мозга'

# Таблица замен: орган -> список резервов (тест отключения, SPEC-0001 G2).
substitutions:
  ollama: [llama.cpp]
  markitdown: []
  browser-use: []
  openclaw: []
