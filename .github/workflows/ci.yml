name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Минимальные полномочия воркфлоу (Scorecard Token-Permissions)
permissions:
  contents: read

# Волна-9 (0.23.0, W-0018): устаревшие прогоны PR отменяются сами —
# время бегунов и Человека не горит на висящих хвостах.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Пин по SHA (Scorecard Pinned-Dependencies); v7.0.1 (верифицировано живым API 2026-11-02)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: YAML и JSON валидны
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          import yaml
          ok = True
          for p in sorted(pathlib.Path('.').rglob('*')):
              if p.is_dir() or '.git' in p.parts:
                  continue
              if p.suffix in ('.yaml', '.yml'):
                  try:
                      doc = yaml.safe_load(p.read_text(encoding='utf-8'))
                      if str(p).startswith('.github/workflows/'):
                          # Структурный гейт: GitHub отвергает воркфлоу с пустым
                          # job'ом (startup_failure), локальный YAML — молчит
                          # (урок 2026-11-02: job потерял runs-on при слиянии).
                          jobs = (doc or {}).get('jobs') or {}
                          assert jobs, 'нет jobs'
                          for name, job in jobs.items():
                              assert job, f'пустой job: {name}'
                              assert job.get('steps'), f'job без steps: {name}'
                  except AssertionError as e:
                      ok = False
                      print(f'WORKFLOW FAIL {p}: {e}')
                  except Exception as e:
                      ok = False
                      print(f'YAML FAIL {p}: {e}')
              elif p.suffix == '.json':
                  try:
                      json.loads(p.read_text(encoding='utf-8'))
                  except Exception as e:
                      ok = False
                      print(f'JSON FAIL {p}: {e}')
          sys.exit(0 if ok else 1)
          PY

      - name: Спеки имеют статус
        run: |
          for f in specs/*.md; do
            grep -qi '^[[:space:]]*-*[[:space:]]*Статус:' "$f" || { echo "нет статуса: $f"; exit 1; }
          done
          echo "все спеки снабжены статусом"

      - name: Конверт крови соответствует SPEC-0003
        run: |
          python3 - <<'PY'
          import json, pathlib
          schema = json.loads(pathlib.Path('blood/envelope.schema.json').read_text(encoding='utf-8'))
          required = {'id', 'ts', 'type', 'source', 'organ', 'trace_id', 'payload', 'cost'}
          assert required.issubset(schema['properties']), 'не все обязательные поля в схеме'
          assert set(schema['required']) == required, 'required в схеме не совпадает с контрактом'
          print('схема крови согласована со SPEC-0003')
          PY

  hygiene:
    # Гигиена дома (0.16.0): docs-drift ловится на автомате — протухающие числа,
    # расползшиеся версии, битые/оторванные ссылки, пути и SPEC/ADR-ссылки,
    # точки входа, секреты (0.23.0); блоха = красный PR (scripts/doctor.py).
    # Волна-9: каждый прогон оставляет память — json-отчёт артефактом и
    # таблица в summary (W-0017). Автопортреты — под гейтом свежести.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2  # волна №26: гейт spec-first судит HEAD-коммит по родителю — shallow-клон (depth: 1) оставлял гейт fail-closed красным

      - name: Доктор дома (машиночитаемый отчёт)
        run: python3 scripts/doctor.py --json > doctor-report.json

      - name: Память воротов — таблица в summary
        if: always()
        run: python3 scripts/doctor_report.py doctor-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Память воротов — артефакт прогона
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4 (верифицировано живым API 2026-11-02)
        with:
          name: doctor-report-${{ github.run_id }}
          path: doctor-report.json
          if-no-files-found: error

      - name: Автопортреты свежи (гейт --check + регенерация)
        run: |
          python3 scripts/organ_map.py --check
          python3 scripts/selfmap.py
          git diff --exit-code -- docs/selfmap.md

  reuse:
    # Иммунитет: пофайловое лицензирование REUSE 3.3 (SPDX) — PROVENANCE.md машинно-проверяем
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  immune:
    # Иммунитет: лицензионный барьер тела (SPEC-0006, ADR-0008) —
    # AGPL/fair-code/NOASSERTION не встраиваются; fail-closed на неизвестное
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Лицензионный барьер (манифест + реестр)
        run: python3 -m immune

  pipeline:
    # Конвейер: n8n как внешний узел (SPEC-0007, ADR-0009) — артефакты-данные,
    # белый список команд, fail-closed на произвольный shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Валидатор конвейера (воркфлоу + compose)
        run: python3 -m pipeline

  transplant:
    # Исходящий иммунитет: донорский протокол органов (SPEC-0009, ADR-0011) —
    # кровь уходит в upstream только по рукопожатию (DCO) и тому, кто дарит;
    # CLA-ошейник не подписывается — патч живёт внутри организма
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Донорский протокол (карты донорства)
        run: python3 -m immune.donation

  effector:
    # Эффектор: openclaw как внешние руки (SPEC-0008, ADR-0010) — CLI-мост,
    # белый список методов, данные-политика fail-closed (CVE-2026-25253, ClawHub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Валидатор эффекта (политика + белый список)
        run: python3 -m openclaw check

  core:
    # Исполнимое ядро 0.2: приёмки спек SPEC-0001..0003 как pytest (ADR-0004)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2  # волна №26: гейт spec-first судит HEAD-коммит по родителю — shallow-клон (depth: 1) оставлял гейт fail-closed красным

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Тесты ядра (приёмки SPEC-0001..0004)
        run: |
          python -m pip install --disable-pip-version-check --quiet '.[dev]'
          python -m pytest -q

  pathogens:
    # Иммунитет против патогенов (0.12.0): известные уязвимости зависимостей
    # по OSV-базе (pip-audit). Барьер лицензий (job immune) — чистая функция
    # без сети (ADR-0008); патогены приходят с пищей (зависимостями), поэтому
    # ищутся там, где тело кормится, — в установленном окружении целиком.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Патогены (pip-audit 2.10.1, OSV)
        run: |
          python -m pip install --disable-pip-version-check --quiet '.[dev]' 'pip-audit==2.10.1'
          python -m pip_audit --skip-editable --progress-spinner off
